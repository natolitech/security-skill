name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint markdown
        run: |
          npx --yes markdownlint-cli2 "**/*.md" "#node_modules" "#tests/fixtures/vuln-app" "#security-reviews" "#AGENT.md" "#threat.md" "#compliance.md" "#code.md"
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck install.sh tests/score-report.sh
